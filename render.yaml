services:
  - type: web
    name: callmentor
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: callmentor-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: TOOL_SECRET
        generateValue: true
      - key: AGENT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: VOICE_NUMBER
        sync: false
      - key: WHATSAPP_LINK
        sync: false
      - key: PINELABS_CLIENT_ID
        sync: false
      - key: PINELABS_CLIENT_SECRET
        sync: false
      - key: PINELABS_MID
        sync: false
      - key: PINELABS_BASE_URL
        sync: false
databases:
  - name: callmentor-db
    plan: free
